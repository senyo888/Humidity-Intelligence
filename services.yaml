flash_lights:
  name: Flash lights
  description: Flash selected lights for an alert
  fields:
    power_entity:
      name: Optional power entity
      description: Optional switch or light that powers the circuit
      selector:
        entity:
          domain: [switch, light]
    lights:
      name: Lights to flash
      description: Optional lights to flash
      required: false
      selector:
        entity:
          domain: light
          multiple: true
    color:
      name: Flash color
      description: RGB color for flashing lights
      selector:
        color_rgb: {}
    duration:
      name: Duration in seconds
      description: Total flash duration (1-300s)
      selector:
        number:
          min: 1
          max: 300
          step: 1
          mode: slider
          unit_of_measurement: s
    flash_count:
      name: Number of flashes
      description: Override flash count (optional, 1-240). HI humidity/mould/condensation visual alerts use 10 flashes per cycle and repeat after 30 minutes only while the same alert remains active.
      selector:
        number:
          min: 1
          max: 240
          step: 1
          mode: slider
refresh_ui:
  name: Refresh UI Mapping
  description: Rebuild entity mapping and re-render cached dashboard YAML cards. Already-pasted Manual dashboard cards remain static until refreshed from a new dump_cards export. HI can also run this automatically shortly after Home Assistant startup when the startup refresh option is enabled.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to refresh; omit to refresh all
      selector:
        text: {}
dump_diagnostics:
  name: Dump Diagnostics
  description: Write diagnostics (config, options, mapping, active target profile, alert resolution, visual alert config, house humidity drift dependency, unavailable entities, cards) to a JSON file in the Home Assistant config folder
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to dump; omit to dump all
      selector:
        text: {}
    filename:
      name: Filename
      description: Output filename in the HA config folder (basename only, no slashes)
      selector:
        text: {}
self_check:
  name: Self Check
  description: Validate entity mapping, generated-card entity references, frontend dependencies, house humidity drift dependency, local HI-only snapshot status, and telemetry setup
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to check; omit to check all
      selector:
        text: {}
v205_release_check:
  name: Release Check
  description: Run a read-only v2.0.5-v2.0.7 validation report for generated-card visibility, generated-card entity availability, dump_cards scope behavior, cached layouts, unresolved placeholders, frontend dependency status, house humidity drift dependency status, optional local HI-only snapshot status, and configured entity availability.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to check; omit to check all
      selector:
        text: {}
    filename:
      name: Filename
      description: Output filename in the HA config folder (defaults to humidity_intelligence_v205_release_check.json)
      selector:
        text: {}
    write_test_exports:
      name: Write test card exports
      description: When enabled, writes test card export files to verify unscoped dump_cards exports all layouts and scoped layout exports only v2_tablet. No devices or runtime outputs are changed.
      selector:
        boolean: {}
    require_local_hi_snapshot:
      name: Require local HI snapshot
      description: Optional release gate. When enabled, the release check fails if there is no fresh local HI-only snapshot. Leave disabled for normal validation.
      selector:
        boolean: {}
    max_snapshot_age_minutes:
      name: Maximum snapshot age
      description: Maximum local HI-only snapshot age in minutes when require_local_hi_snapshot is enabled.
      selector:
        number:
          min: 1
          max: 10080
          step: 1
          mode: box
          unit_of_measurement: min
create_local_backup:
  name: Create Local HI Snapshot
  description: Create a local HI-only snapshot of /config/custom_components/humidity_intelligence. This is not a Home Assistant backup, does not intercept HACS updates, and does not change running code until Home Assistant is restarted.
  fields:
    retain_count:
      name: Snapshots to retain
      description: Number of finalized local HI-only snapshots to retain after a successful create operation (1-5, default 2).
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: box
    max_total_bytes:
      name: Maximum total bytes
      description: Maximum total bytes for finalized local HI-only snapshots after retention cleanup (default 52428800, hard maximum 262144000).
      selector:
        number:
          min: 1
          max: 262144000
          step: 1048576
          mode: box
          unit_of_measurement: B
list_saved_versions:
  name: List Local HI Snapshots
  description: List finalized local HI-only snapshots and invalid snapshot folders. This is not a Home Assistant backup and does not change running code.
  fields: {}
dump_cards:
  name: Dump Cards
  description: Write rendered card YAML to the Home Assistant config folder for static Manual dashboards. Without layout, all cached layouts are exported; with layout, only that layout is exported.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to dump; omit to dump all
      selector:
        text: {}
    filename:
      name: Filename
      description: Optional base filename (defaults to humidity_intelligence_cards; basename only)
      selector:
        text: {}
    layout:
      name: Layout (optional)
      description: Optional. Omit to dump all cached layouts, or supply one layout (v2_mobile, v2_tablet, v1_mobile, view_cards_button).
      selector:
        text: {}
create_dashboard:
  name: Create Dashboard
  description: Create a new Lovelace dashboard from the rendered card YAML
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to use; omit to use the first entry
      selector:
        text: {}
    layout:
      name: Layout
      description: Card layout key (v2_mobile or v2_tablet)
      selector:
        select:
          options:
            - v2_mobile
            - v2_tablet
    title:
      name: Dashboard title
      description: Name shown in the sidebar
      selector:
        text: {}
    url_path:
      name: URL path
      description: Sidebar URL path (lowercase letters/numbers/_/- only)
      selector:
        text: {}
view_cards:
  name: View Cards
  description: Dump cards to file and post a notification with the file path
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to use; omit to use all
      selector:
        text: {}
    filename:
      name: Filename
      description: Optional base filename (defaults to humidity_intelligence_cards; basename only)
      selector:
        text: {}
    layout:
      name: Layout (optional)
      description: Dump a single layout (v2_mobile, v2_tablet, v1_mobile, view_cards_button)
      selector:
        text: {}
purge_files:
  name: Purge Files
  description: Delete all generated Humidity Intelligence files (cards, diagnostics, self-check) and attempt dashboard cleanup
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to purge; omit to purge all
      selector:
        text: {}
pause_control:
  name: Pause Control
  description: Pause the automation engine for a number of minutes (default 60)
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to pause; omit to pause all
      selector:
        text: {}
    minutes:
      name: Minutes
      description: Pause duration in minutes
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
resume_control:
  name: Resume Control
  description: Resume the automation engine immediately by clearing the pause timer
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to resume; omit to resume all
      selector:
        text: {}
