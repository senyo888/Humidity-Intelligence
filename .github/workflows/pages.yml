name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/logo.png"
      - "assets/header.png"
      - "assets/site/github-pages-hero.png"
      - "assets/v2_ui_gallery/v204_presence_gate_reason.png"
      - "assets/v2_ui_gallery/ui_v2_mobile_aq.png"
      - "assets/v2_ui_gallery/ui_v2_tablet_zone_2.png"
      - "scripts/build_hi_inspector.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/site _site/assets/v2_ui_gallery
          cp site/index.html site/styles.css site/robots.txt site/sitemap.xml _site/
          python3 scripts/build_hi_inspector.py _site/inspector
          cp assets/logo.png _site/assets/logo.png
          cp assets/header.png _site/assets/header.png
          cp assets/site/github-pages-hero.png _site/assets/site/github-pages-hero.png
          cp assets/v2_ui_gallery/v204_presence_gate_reason.png _site/assets/v2_ui_gallery/v204_presence_gate_reason.png
          cp assets/v2_ui_gallery/ui_v2_mobile_aq.png _site/assets/v2_ui_gallery/ui_v2_mobile_aq.png
          cp assets/v2_ui_gallery/ui_v2_tablet_zone_2.png _site/assets/v2_ui_gallery/ui_v2_tablet_zone_2.png
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
