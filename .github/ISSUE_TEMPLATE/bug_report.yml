name: Bug report
description: Report something that is not working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please redact private entity IDs, URLs, tokens, addresses, and personal data.
  - type: input
    id: hi-version
    attributes:
      label: Humidity Intelligence version
      placeholder: "2.0.4"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.4.3"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - HACS
        - Manual
        - Other / unsure
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Runtime/control
        - Config flow/options
        - Generated UI/dashboard
        - Services/diagnostics
        - Documentation
        - HACS/install
        - Governance/release
        - Unsure
    validations:
      required: true
  - type: input
    id: browser-app
    attributes:
      label: Browser/app, if relevant
      placeholder: "Chrome, HA iOS app, etc."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behaviour, actual behaviour, and steps to reproduce.
    validations:
      required: true
  - type: checkboxes
    id: triage-signals
    attributes:
      label: Triage signals
      options:
        - label: Safety, CO, or emergency behaviour may be affected.
        - label: This may block a release or HACS install.
        - label: This looks like a regression from a previous HI version.
        - label: This may be a duplicate of another issue.
        - label: I think this needs maintainer/community reply rather than code.
        - label: I think this needs proposal review before implementation.
  - type: dropdown
    id: refresh-ui
    attributes:
      label: Did you run `humidity_intelligence.refresh_ui` after updating?
      options:
        - "Yes"
        - "No"
        - "Not relevant"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: validation-tried
    attributes:
      label: Checks already tried
      description: List any relevant commands or services, such as refresh_ui, self_check, v205_release_check, dump_diagnostics, or a Home Assistant restart.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs, entities, or screenshots
      description: Paste relevant redacted logs/config and attach screenshots if useful.
      render: text
