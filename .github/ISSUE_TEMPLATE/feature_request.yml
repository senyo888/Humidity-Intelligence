name: Feature request
description: Suggest an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Runtime/control
        - Config flow/options
        - Generated UI/dashboard
        - Services/diagnostics
        - Documentation
        - HACS/install
        - Governance/release
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: proposal-scope
    attributes:
      label: Proposal scope
      options:
        - Small bugfix-sized change
        - UI polish
        - Runtime semantics
        - Release/governance
        - v2.1 or later exploration
        - Unsure
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What problem would this solve, and what behaviour would you like?
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why it fits Humidity Intelligence
      description: Explain why this belongs in the integration.
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Additional areas
      options:
        - label: Backend/runtime
        - label: UI/dashboard
        - label: Config flow
        - label: Documentation
        - label: UI Gallery
